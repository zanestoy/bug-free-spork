<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07151d">
  <meta name="description" content="Play the classic Lights Out puzzle: switch off all 25 lights. A free browser game with hints and three difficulty levels.">
  <title>Lights Out | A Classic Logic Puzzle</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #07151d;
      --panel: #0d2530;
      --panel-edge: #33505c;
      --muted: #a2bbc2;
      --white: #eaf7f5;
      --accent: #a7f6d4;
      --gold: #f4d69c;
      --space: clamp(8px, 2vw, 13px);
    }
    * { box-sizing: border-box; }
    html { min-height: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      padding: max(20px, env(safe-area-inset-top)) 14px max(24px, env(safe-area-inset-bottom));
      background: radial-gradient(ellipse at 50% -15%, #17424b 0%, transparent 58%),
        radial-gradient(ellipse at 100% 100%, #102b34 0%, transparent 50%), var(--bg);
      color: var(--white);
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: grid;
      place-items: center;
    }
    button, select { font: inherit; }
    button { -webkit-tap-highlight-color: transparent; cursor: pointer; }
    button:focus-visible, select:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
    main { width: min(100%, 560px); }
    .header { text-align: center; margin: 0 0 22px; }
    .eyebrow { text-transform: uppercase; letter-spacing: .34em; font-size: 11px; color: var(--gold); font-weight: 800; }
    h1 { margin: 6px 0 1px; font-size: clamp(48px, 11vw, 72px); line-height: .94; letter-spacing: -.075em; font-weight: 900; text-transform: uppercase; text-shadow: 0 4px 24px #0005; }
    h1 span { color: var(--accent); }
    .subtitle { margin: 12px 0 0; color: var(--muted); font-size: 14px; }
    .cabinet {
      padding: clamp(16px, 4vw, 26px);
      border: 1px solid #3e616b;
      border-radius: 26px;
      background: linear-gradient(150deg, #14333e, #0b202a 45%, #0a1e27);
      box-shadow: 0 24px 60px #0008, inset 0 1px 0 #a4ffdf25, 0 0 0 5px #041017;
    }
    .topbar { display:flex; align-items: end; justify-content: space-between; gap: 12px; margin-bottom: 15px; }
    .field-label, .metric small { display:block; font-size: 10px; font-weight: 800; letter-spacing: .16em; color: var(--muted); text-transform: uppercase; margin-bottom: 5px; }
    select {
      background: #09202a; border: 1px solid #44646c; border-radius: 9px; color: var(--white);
      padding: 9px 32px 9px 11px; min-height: 39px; max-width: 170px;
    }
    .stats { display: flex; gap: 19px; text-align: right; }
    .metric strong { font: 800 22px/1 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: -.05em; font-variant-numeric: tabular-nums; }
    .board-frame { border: 1px solid #45626b; border-radius: 17px; background: #04141b; padding: var(--space); box-shadow: inset 0 2px 16px #0008, 0 1px 0 #ffffff13; }
    .board { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: var(--space); }
    .light {
      position: relative;
      aspect-ratio: 1;
      min-width: 0;
      border: 1px solid #2d4650;
      border-radius: clamp(8px, 2vw, 13px);
      background: linear-gradient(145deg, #17303a, #0b1b24);
      box-shadow: inset 0 3px 6px #0009, 0 1px 0 #ffffff0e;
      transition: background .16s ease, box-shadow .16s ease, transform .12s ease, border-color .16s ease;
      touch-action: manipulation;
    }
    .light::after { content:""; position:absolute; inset: 23%; border-radius: 50%; background: #3e6570; opacity:.27; transition: opacity .16s, background .16s; }
    .light.is-on {
      border-color: #b8ffdf;
      background: radial-gradient(circle at 43% 35%, #e6fff0 0%, #adffdc 24%, #58dcb5 60%, #27a888 100%);
      box-shadow: inset 0 1px 4px #fff9, 0 0 18px #66f9c37a, 0 0 5px #abffe8;
    }
    .light.is-on::after { opacity: .3; background: #fff; }
    .light:active { transform: scale(.94); }
    .light.is-hint { outline: 3px solid var(--gold); outline-offset: -5px; animation: suggest 1s ease-in-out infinite; }
    @keyframes suggest { 0%,100% {box-shadow: 0 0 0 1px #f4d69c70, 0 0 18px #f4d69c30;} 50% {box-shadow: 0 0 0 3px #f4d69ca0, 0 0 25px #f4d69c7a;} }
    .status { min-height: 52px; margin: 12px 0 13px; padding: 11px 9px; border-radius: 11px; background: #091d26; text-align: center; color: #bed5d9; font-size: 13px; display: grid; place-items: center; }
    .status.win { color: #b7ffdb; background: #143d35; border: 1px solid #2e8869; font-weight: 700; }
    .controls { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 9px; }
    .control { color: var(--white); background: #1a3944; border: 1px solid #486873; border-radius: 11px; min-height: 45px; padding: 10px 6px; font-size: 13px; font-weight: 750; transition: filter .12s; }
    .control:hover:not(:disabled) { filter: brightness(1.18); }
    .control:disabled { opacity: .38; cursor: not-allowed; }
    .control.primary { background: #a5f1cd; color: #09251f; border-color: #d1ffe7; }
    .footer { text-align: center; margin-top: 20px; }
    .instructions { color: #c5d9dc; font-size: 13px; line-height: 1.65; margin: 0; }
    .instructions b { color: #ecfffa; }
    .foot-actions { display: flex; justify-content: center; align-items: center; gap: 16px; margin-top: 12px; }
    .text-btn { background: none; border: none; color: #a4e3cd; text-decoration: underline; text-underline-offset: 3px; padding: 8px 4px; font-size: 12px; }
    .credit { color: #70929a; font-size: 11px; margin: 13px 0 0; }
    @media (max-width: 370px) {
      .stats { gap: 10px; }
      .metric strong { font-size: 18px; }
      select { max-width: 122px; padding-right: 8px; }
      .cabinet { padding: 12px; border-radius: 18px; }
      .controls { gap: 6px; }
      .control { font-size: 12px; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
  </style>
</head>
<body>
<main>
  <header class="header">
    <div class="eyebrow">A classic logic puzzle</div>
    <h1>LIGHTS <span>OUT</span></h1>
    <p class="subtitle">One tap changes everything.</p>
  </header>
  <section class="cabinet" aria-label="Lights Out game">
    <div class="topbar">
      <div>
        <label class="field-label" for="difficulty">Difficulty</label>
        <select id="difficulty">
          <option value="easy">Easy</option>
          <option value="normal" selected>Classic</option>
          <option value="hard">Expert</option>
        </select>
      </div>
      <div class="stats" aria-label="Game statistics">
        <div class="metric"><small>Moves</small><strong id="moves">00</strong></div>
        <div class="metric"><small>Time</small><strong id="time">0:00</strong></div>
        <div class="metric"><small>Best</small><strong id="best">--</strong></div>
      </div>
    </div>
    <div class="board-frame">
      <div class="board" id="board" role="group" aria-label="Five by five Lights Out puzzle"></div>
    </div>
    <div class="status" id="status" role="status" aria-live="polite">Turn off every light to win.</div>
    <div class="controls">
      <button type="button" class="control" id="undo">↶ Undo</button>
      <button type="button" class="control" id="hint">✦ Hint</button>
      <button type="button" class="control primary" id="new">↻ New game</button>
    </div>
  </section>
  <footer class="footer">
    <p class="instructions">Tap a square to switch <b>itself and its four neighbors</b>.<br>The goal: make <b>every square dark</b>.</p>
    <div class="foot-actions">
      <button type="button" class="text-btn" id="restart">Restart puzzle</button>
      <button type="button" class="text-btn" id="share">Copy puzzle link</button>
    </div>
    <p class="credit">No ads · No accounts · Works offline</p>
  </footer>
</main>
<script>
(() => {
  'use strict';
  const SIZE = 5;
  const COUNT = SIZE * SIZE;
  const modes = {
    easy: { min: 2, max: 4, presses: [2, 6] },
    normal: { min: 6, max: 9, presses: [8, 15] },
    hard: { min: 10, max: 25, presses: [14, 23] }
  };
  const $ = (id) => document.getElementById(id);
  const boardElement = $('board');
  const tiles = [];
  let board = Array(COUNT).fill(0);
  let initial = board.slice();
  let undoStack = [];
  let moves = 0;
  let elapsed = 0;
  let clock = null;
  let finished = false;
  let hintIndex = -1;
  let mode = 'normal';

  function toggle(b, index) {
    const r = Math.floor(index / SIZE), c = index % SIZE;
    [[r,c],[r-1,c],[r+1,c],[r,c-1],[r,c+1]].forEach(([rr,cc]) => {
      if (rr >= 0 && rr < SIZE && cc >= 0 && cc < SIZE) b[rr*SIZE + cc] ^= 1;
    });
  }

  // Every candidate is checked, so the hint is a shortest possible solution.
  // Choosing the first-row presses determines all subsequent row presses.
  function solve(b) {
    let best = null;
    for (let mask = 0; mask < 1 << SIZE; mask++) {
      const working = b.slice();
      const presses = Array(COUNT).fill(0);
      for (let c = 0; c < SIZE; c++) {
        if (mask & (1 << c)) { presses[c] = 1; toggle(working, c); }
      }
      for (let r = 1; r < SIZE; r++) {
        for (let c = 0; c < SIZE; c++) {
          const index = r*SIZE + c;
          if (working[index - SIZE]) { presses[index] = 1; toggle(working, index); }
        }
      }
      if (!working.some(Boolean)) {
        const count = presses.reduce((sum, x) => sum + x, 0);
        if (!best || count < best.count) best = { presses, count };
      }
    }
    return best;
  }

  function randomInt(a, b) {
    return Math.floor(Math.random() * (b - a + 1)) + a;
  }
  function makeBoard(level) {
    const cfg = modes[level];
    let fallback = null;
    for (let attempt = 0; attempt < 800; attempt++) {
      const next = Array(COUNT).fill(0);
      const choices = [...Array(COUNT).keys()];
      const count = randomInt(...cfg.presses);
      for (let k = 0; k < count; k++) {
        const chosen = randomInt(0, choices.length - 1);
        toggle(next, choices.splice(chosen, 1)[0]);
      }
      const solution = solve(next);
      if (!solution || solution.count === 0) continue;
      if (!fallback || solution.count > fallback.count) fallback = { board: next, count: solution.count };
      if (solution.count >= cfg.min && solution.count <= cfg.max) return next;
    }
    return fallback.board;
  }

  function encode(b) {
    let bits = 0;
    b.forEach((on, i) => { if (on) bits |= (1 << i); });
    return bits.toString(16).padStart(7, '0');
  }
  function puzzleFromHash() {
    const match = /^#p=([0-9a-f]{1,7})$/i.exec(location.hash);
    if (!match) return null;
    const bits = parseInt(match[1], 16);
    if (bits > 0x1ffffff) return null;
    const b = Array.from({length: COUNT}, (_, i) => (bits >>> i) & 1);
    return solve(b) && b.some(Boolean) ? b : null;
  }
  function setHash(b) {
    if (!window.history || !window.history.replaceState) return;
    try { history.replaceState(null, '', '#p=' + encode(b)); } catch (_) { /* file URL restrictions */ }
  }
  function stopClock() {
    if (clock !== null) { clearInterval(clock); clock = null; }
  }
  function startClock() {
    if (clock !== null || finished) return;
    clock = setInterval(() => { elapsed++; renderStats(); }, 1000);
  }
  function formatTime(s) {
    return Math.floor(s/60) + ':' + String(s%60).padStart(2, '0');
  }
  function getBest() {
    try { return localStorage.getItem('lights-out-best-' + mode); } catch (_) { return null; }
  }
  function saveBest(value) {
    try { localStorage.setItem('lights-out-best-' + mode, value); } catch (_) { /* storage may be blocked */ }
  }
  function renderStats() {
    $('moves').textContent = String(moves).padStart(2, '0');
    $('time').textContent = formatTime(elapsed);
    $('best').textContent = getBest() || '--';
  }
  function say(message, won = false) {
    $('status').textContent = message;
    $('status').classList.toggle('win', won);
  }
  function render() {
    board.forEach((on, i) => {
      const tile = tiles[i];
      const row = Math.floor(i / SIZE) + 1, column = i % SIZE + 1;
      tile.classList.toggle('is-on', Boolean(on));
      tile.classList.toggle('is-hint', i === hintIndex);
      tile.setAttribute('aria-pressed', String(Boolean(on)));
      tile.setAttribute('aria-label', `Row ${row}, column ${column}: ${on ? 'on' : 'off'}${i === hintIndex ? ', hint' : ''}`);
    });
    $('undo').disabled = undoStack.length === 0;
    $('hint').disabled = finished;
    renderStats();
  }
  function checkWin() {
    if (!board.some(Boolean)) {
      finished = true;
      stopClock();
      const best = getBest();
      let record = '';
      if (!best || moves < Number(best)) { saveBest(String(moves)); record = ' ★ New best!'; }
      say(`You did it! All lights out in ${moves} moves and ${formatTime(elapsed)}.${record}`, true);
      return true;
    }
    return false;
  }
  function press(index) {
    if (finished) return;
    undoStack.push({ board: board.slice(), moves, elapsed });
    if (undoStack.length > 500) undoStack.shift();
    if (moves === 0) startClock();
    toggle(board, index);
    moves++;
    hintIndex = -1;
    if (!checkWin()) say('Keep going. Every light can be turned off.');
    render();
  }
  function loadPuzzle(next, text) {
    board = next.slice();
    initial = next.slice();
    undoStack = [];
    moves = 0;
    elapsed = 0;
    hintIndex = -1;
    finished = false;
    stopClock();
    say(text);
    setHash(initial);
    render();
  }
  function newGame() {
    loadPuzzle(makeBoard(mode), 'New puzzle ready. Turn off every light!');
  }
  function undo() {
    if (!undoStack.length) return;
    const previous = undoStack.pop();
    board = previous.board;
    moves = previous.moves;
    elapsed = previous.elapsed;
    hintIndex = -1;
    finished = false;
    stopClock();
    if (moves > 0) startClock();
    say('Last move undone.');
    render();
  }
  function hint() {
    if (finished) return;
    const solution = solve(board);
    if (!solution || solution.count === 0) return;
    hintIndex = solution.presses.findIndex(Boolean);
    say(`Try the highlighted square. A shortest solution uses ${solution.count} ${solution.count === 1 ? 'move' : 'moves'} from here.`);
    render();
    tiles[hintIndex].focus({ preventScroll: true });
  }
  async function share() {
    const url = location.href.split('#')[0] + '#p=' + encode(initial);
    try {
      if (!navigator.clipboard || !navigator.clipboard.writeText) throw new Error('Clipboard unavailable');
      await navigator.clipboard.writeText(url);
      say('Puzzle link copied. Share it with someone!');
    } catch (_) {
      // Fallback for local files and browsers that disallow clipboard access.
      const field = document.createElement('textarea');
      field.value = url;
      field.setAttribute('readonly', '');
      field.style.position = 'fixed'; field.style.opacity = '0';
      document.body.appendChild(field);
      field.select();
      let copied = false;
      try { copied = document.execCommand('copy'); } catch (_) {}
      field.remove();
      if (copied) say('Puzzle link copied. Share it with someone!');
      else window.prompt('Copy this puzzle link:', url);
    }
  }

  for (let i = 0; i < COUNT; i++) {
    const tile = document.createElement('button');
    tile.type = 'button';
    tile.className = 'light';
    tile.addEventListener('click', () => press(i));
    boardElement.appendChild(tile);
    tiles.push(tile);
  }
  $('difficulty').addEventListener('change', (e) => { mode = e.target.value; newGame(); });
  $('new').addEventListener('click', newGame);
  $('undo').addEventListener('click', undo);
  $('hint').addEventListener('click', hint);
  $('restart').addEventListener('click', () => loadPuzzle(initial, 'Puzzle restarted. You can do it!'));
  $('share').addEventListener('click', share);
  const shared = puzzleFromHash();
  if (shared) loadPuzzle(shared, 'Shared puzzle loaded. Turn off every light!');
  else newGame();
})();
</script>
</body>
</html>
